name: Replay Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

jobs:
  replay-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run replay tests
        run: npx tsx scripts/replay-tests.ts
